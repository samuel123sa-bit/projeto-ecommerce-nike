<header class="app-header">
  <nav class="nav-container">

    <!-- Logo Nike (Swoosh) -->
    <div class="logo">
      <a routerLink="/home" aria-label="Nike Home">
        <svg class="swoosh-icon" viewBox="0 0 24 24" width="60" height="22">
          <path fill="currentColor"
            d="M21.71 6.34c-.38-.28-9.14 5.86-12.82 8.35-2.09 1.41-4.08 2.05-5.63 1.83-1.44-.2-2.31-1.04-2.58-2.51-.27-1.47.16-3.32 1.28-5.5 1.13-2.19 2.87-4.5 5.17-6.87.18-.18.06-.49-.18-.49-.13 0-.25.06-.33.15-2.55 2.62-4.48 5.18-5.74 7.61-1.25 2.43-1.74 4.54-1.44 6.25.33 1.89 1.48 3.01 3.42 3.33 2.11.35 4.7-.42 7.72-2.32 4.08-2.56 12.38-9.42 12.75-9.73.18-.15.19-.43.05-.62-.08-.1-.18-.15-.27-.15z" />
        </svg>
      </a>
    </div>

    <!-- Links de Navegação -->
    <ul class="nav-links" [class.is-active]="isMenuOpen">
      <li>
        <a routerLink="/home" routerLinkActive="active" (click)="isMenuOpen = false">Início</a>
      </li>
      <li>
        <a routerLink="/products" routerLinkActive="active" (click)="isMenuOpen = false">Produtos</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="isMenuOpen = false">Sobre</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="isMenuOpen = false">Contato</a>
      </li>
    </ul>

    <!-- Ações (Carrinho e Menu Mobile) -->
    <div class="nav-actions">
      <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Menu">
        <span class="hamburger"></span>
      </button>
    </div>

  </nav>
</header>
